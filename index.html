<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clínica Stella · Sistema de Gestión</title>
  <link rel="stylesheet" href="src/styles/main.css" />
  <!-- Fuentes cargadas desde main.css -->
